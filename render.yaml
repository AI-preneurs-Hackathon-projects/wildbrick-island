services:
  - type: web
    name: brickwild-realtime-arena
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    buildCommand: npm ci
    startCommand: npm run start:realtime
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ARENA_ALLOWED_ORIGINS
        value: https://wildbrick-island.vercel.app
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: REALTIME_TICKET_SECRET
        sync: false
