<!doctype html><html lang="en"><meta charset="utf-8"><title>Map art desktop review</title>
<style>body{margin:0;background:#263e49;color:#fff;font:14px system-ui}canvas{display:block}aside{position:absolute;left:12px;top:12px;width:330px;background:#17333ee8;padding:12px;border-radius:12px}label{display:block;margin:6px 0}button,select{font:inherit;padding:5px}pre{white-space:pre-wrap;font-size:11px}body.clean aside{display:none}</style>
<aside><b>Map art · 1440 × 900</b><label>Map <select id="map"><option>island</option><option>beach</option><option>mountain</option></select></label><label>Camera <select id="camera"><option>foot</option><option>horizon</option><option>elevated</option><option>overview</option></select></label><label>Orbit <select id="orbit"><option>0</option><option>90</option><option>180</option><option>270</option></select></label><label><input id="actors" type="checkbox" checked> Actors, bow, pickup and health label</label><button id="capture">Save matched image</button> <button id="measure">Measure 600 frames</button> <button id="cycle">Cycle maps ×3</button><pre id="status"></pre><p>Development fixture. No network or paid calls. Timings are CPU submission / frame intervals, not GPU timings.</p></aside>
<script type="module">
import * as THREE from '/vendor/three.module.js';
import {createWorld} from '/world.js';
import {createArenaView} from '/arena-view.js';
import {newRoom,addPlayer,makeKit,roomSnapshot} from '/arena-core.js';
import {gameCamera} from '/game-camera.js';
import {arrow} from '/models.js';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bc9ec);scene.fog=new THREE.Fog(0x8bc9ec,95,240);
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});}catch{$('status').textContent='WebGL unavailable. No rendered acceptance or runtime measurement.';throw Error('WebGL unavailable');}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(1440,900);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(48,1440/900,.1,500);
scene.add(new THREE.HemisphereLight(0xe9fcff,0x66854d,2));const sun=new THREE.DirectionalLight(0xffecc5,2.65);sun.position.set(-28,50,24);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:140});sun.shadow.normalBias=.035;sun.shadow.bias=-.00015;sun.shadow.radius=3;scene.add(sun,sun.target);
const view=createArenaView(scene,camera),tracer=arrow();scene.add(tracer);tracer.name='stationary readability sample (not a fired event)';
let world,room,player,snapshot,measurement=null,lastFrame=performance.now(),lastResult='',cycles=[];
function reset(){world?.dispose();view.clear();room=newRoom(100000,'map-art');room.round.mapId=$('map').value;player=addPlayer(room,'art-self','Builder');const rival=addPlayer(room,'art-rival','Rival');const z=$('map').value==='island'?25.5:$('map').value==='beach'?9:0;Object.assign(player,{x:-43,y:$('camera').value==='elevated'?20:0,z,yaw:Math.PI/2,protectedUntil:0,kit:makeKit('bow')});Object.assign(rival,{x:-36,y:player.y,z,yaw:-Math.PI/2,protectedUntil:0,health:64});room.drops=[{id:'art-health',type:'health',x:-39,z:z+2,born:90000,lands:95000}];world=createWorld(scene,$('map').value);snapshot=roomSnapshot(room,player.id);tracer.position.set(-39,player.y+1.4,z);tracer.rotation.y=Math.PI/2;measurement=null;}
function draw(){const kind=$('camera').value;if(kind==='overview'){camera.position.set(95,94,112);camera.lookAt(0,0,0);}else{const p={...player,mode:kind==='elevated'?'plane':'foot',arena:true},look=gameCamera(p,player.kit,{yaw:Math.PI/2+Number($('orbit').value)*Math.PI/180,pitch:kind==='horizon'?-.35:kind==='elevated'?1.15:.43},1440/900);camera.position.copy(look.position);camera.lookAt(look.target.x,look.target.y,look.target.z);}
 view.update($('actors').checked?snapshot:null,player,new Map(),0,100000);tracer.visible=$('actors').checked;world.updateCamera(camera.position,{x:player.x,y:player.y+1.5,z:player.z},1/60);renderer.render(scene,camera);}
function resources(){const mats=new Set(),textures=new Set();scene.traverse(o=>{for(const m of Array.isArray(o.material)?o.material:[o.material])if(m){mats.add(m);for(const v of Object.values(m))if(v?.isTexture)textures.add(v);}});let textureBytes=0;for(const t of textures)textureBytes+=(t.image?.width||0)*(t.image?.height||0)*4*(t.generateMipmaps?4/3:1);return {calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,gpuGeometries:renderer.info.memory.geometries,gpuTextures:renderer.info.memory.textures,sceneMaterials:mats.size,sceneTextureBytesEstimate:Math.ceil(textureBytes),shadowMap:'2048², unchanged; excluded from scene texture estimate',pixelRatio:renderer.getPixelRatio()};}
function summary(values){const sorted=[...values].sort((a,b)=>a-b);return {p50:sorted[Math.floor(sorted.length*.5)],p95:sorted[Math.floor(sorted.length*.95)],p99:sorted[Math.floor(sorted.length*.99)]};}
function frame(now){const interval=now-lastFrame;lastFrame=now;const start=performance.now();draw();const cpu=performance.now()-start;if(measurement){if(measurement.warmup>0)measurement.warmup--;else{measurement.cpu.push(cpu);measurement.intervals.push(interval);if(measurement.cpu.length===600){lastResult=JSON.stringify({map:$('map').value,camera:$('camera').value,orbit:$('orbit').value,actors:$('actors').checked,resources:resources(),cpuSubmitMs:summary(measurement.cpu),frameIntervalMs:summary(measurement.intervals)},null,2);measurement=null;}}}$('status').textContent=measurement?`Warmup ${measurement.warmup}; samples ${measurement.cpu.length}/600`:lastResult||JSON.stringify(resources(),null,2);requestAnimationFrame(frame);}
for(const id of ['map','camera','orbit']){if(params.has(id))$(id).value=params.get(id);$(id).onchange=()=>{lastResult='';reset();};}
$('actors').onchange=()=>{lastResult='';reset();};
$('measure').onclick=()=>{measurement={warmup:120,cpu:[],intervals:[]};};
$('capture').onclick=()=>{draw();const a=document.createElement('a');a.download=`${$('map').value}-${$('camera').value}-${$('orbit').value}.png`;a.href=renderer.domElement.toDataURL('image/png');a.click();};
$('cycle').onclick=async()=>{cycles=[];for(let i=0;i<9;i++){$('map').value=['island','beach','mountain'][i%3];reset();await new Promise(requestAnimationFrame);draw();cycles.push({map:$('map').value,...resources()});}lastResult=JSON.stringify({cycles},null,2);};
reset();requestAnimationFrame(frame);
</script></html>
