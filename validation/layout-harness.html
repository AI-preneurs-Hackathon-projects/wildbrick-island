<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Brickwild layout checks</title><style>body{background:#e7ede7;color:#254139;font:16px sans-serif;padding:20px;margin:0}iframe{display:block;border:2px solid #254139;border-radius:16px;margin:18px auto 36px}h2,p{text-align:center}</style></head><body><h2>1024 × 768 landscape</h2><p>Actual HUD at tablet dimensions. Desktop browser input, no WebGL or microphone.</p><iframe title="Landscape HUD" src="/__controls?play=1&speech=1" width="1024" height="768"></iframe><h2>768 × 1024 portrait</h2><iframe title="Portrait HUD" src="/__controls?play=1&speech=1" width="768" height="1024"></iframe><h2>390 × 844 phone</h2><iframe title="Phone HUD" src="/__controls?play=1&speech=1" width="390" height="844"></iframe><output id="slot-voice-layout" style="display:block;text-align:center" role="status">Checking saved slots and voice panels…</output><script>
// Runs against real rendered iframe boxes; no scene graph or production APIs.
function inspectLayouts(){const rows=[];for(const frame of document.querySelectorAll('iframe')){const d=frame.contentDocument,a=d?.querySelector('.creation-shortcuts'),b=d?.querySelector('.voice-status');if(!a||!b)return;const x=a.getBoundingClientRect(),y=b.getBoundingClientRect(),area=Math.max(0,Math.min(x.right,y.right)-Math.max(x.left,y.left))*Math.max(0,Math.min(x.bottom,y.bottom)-Math.max(x.top,y.top));rows.push({viewport:frame.width,overlap:Math.round(area)});}const output=document.querySelector('#slot-voice-layout');output.textContent=rows.map(r=>r.viewport+'px: '+r.overlap+'px² slot/transcript overlap').join(' · ');output.dataset.passed=String(rows.every(r=>r.overlap===0));}
setInterval(inspectLayouts,250);
</script></body></html>
