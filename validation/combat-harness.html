<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrickWild firing validation</title>
<style>body{margin:0;background:#b4dedd;font:15px system-ui;color:#183d35}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;top:16px;left:16px;max-width:320px;max-height:calc(100vh - 70px);overflow:auto;padding:18px;background:#fffaf0ee;border-radius:12px}label{display:block;margin:10px 0}button,select,input{font:inherit;padding:8px}output{display:block;white-space:pre-line;margin-top:12px}p{font-size:13px;line-height:1.5}</style>
<aside><strong>Local combat validation</strong><p>Actual Arena simulation and renderer. Snapshots are delivered after each step; no production multiplayer or API calls.</p><label>Weapon <select id="weapon"><option value="hammer">Hammer</option><option value="bow">Bow</option><option value="rifle">Saved car as carried rifle</option><option value="pulse">Saved car as carried pulse</option><option value="octopus-carry">Saved octopus as carried pulse</option><option value="octopus">Saved mounted octopus</option><option value="dragon">Saved flying dragon</option><option value="flame">Saved dragon as carried flame</option><option value="sword">Sword</option><option value="foot">Punch</option><option value="fly">Flying guns</option><option value="rover">Twin-gun rover</option></select></label><label>Camera orbit <select id="orbit"><option value="0">Behind character</option><option value="1.57079632679">Sideways</option><option value="3.14159265359">In front / backward</option></select></label><label>Target case <select id="target"><option value="none">No rival</option><option value="pointblank">Body-centered Z 0.9</option><option value="overlap">Exact overlap</option><option value="normal">Body-forward normal range</option><option value="behind">Behind Z -1</option><option value="far">Out of range Z 80</option><option value="car">Car center Z 4</option><option value="protected">Protected Z 0.9</option><option value="cover">Cover before target</option><option value="after">Cover after target</option></select></label><label>Normal distance <select id="distance"><option>2</option><option selected>5</option><option>10</option><option>20</option></select> m</label><label>Body facing <select id="facing"><option value="0">0°</option><option value="45">45°</option><option value="90">90°</option><option value="135">135°</option><option value="180">180°</option><option value="225">225°</option><option value="270">270°</option><option value="315">315°</option></select></label><button id="fire">Fire + 20 ms</button> <button id="advance">Advance 80 ms</button><button id="reset">Reset</button><button id="defeat">Defeat player</button><button id="settle">Wait 2 seconds</button><button id="respawn">Respawn</button><button id="drop-item">Drop item</button><button id="pickup-item">Pick up item</button><output id="status"></output></aside>
<script type="module">
import {hammer} from '/__hammer-fixture.js';
import saved from '/__combat-fixtures.js';
import * as THREE from '/vendor/three.module.js';
import {createArenaView} from '/arena-view.js';
import {newRoom,addPlayer,makeKit,applyInput,advanceRoom,roomSnapshot,hurt,attackBlockReason} from '/arena-core.js';
import {WORLD_ENTITIES} from '/world-data.js';
import {SUPPLY_BLUEPRINTS} from '/supply-catalog.js';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,200),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#b4dedd');document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x74896a,2.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-5,10,-6);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:'#8cbf79'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);scene.add(new THREE.GridHelper(60,30,0x536f55,0x80a774));camera.position.set(5,3.6,-6);camera.lookAt(0,1.2,0);
const wall=new THREE.Mesh(new THREE.BoxGeometry(12,5,.4),new THREE.MeshStandardMaterial({color:'#cb7255'}));wall.position.set(0,2.5,7);scene.add(wall);const view=createArenaView(scene,camera);let room,player,target,cursor,seq,last='',rejection=null;
function draw(dt=0){const snap=roomSnapshot(room,player.id,cursor);for(const e of snap.events){view.effect(e);cursor=e.id;if(['shot','swing','hit','blocked','impact','shot-end'].includes(e.type))last=e.type+': '+[e.x,e.y,e.z].map(n=>(n??0).toFixed(2)).join(', ');}view.update(snap,player,SUPPLY_BLUEPRINTS,dt,room.time);renderer.render(scene,camera);document.querySelector('#status').textContent='Camera yaw: '+Number(document.querySelector('#orbit').value).toFixed(2)+' rad\nBody facing: '+player.yaw.toFixed(2)+' rad\n'+last+'\nRejected: '+(rejection||'no')+'\nTarget health / mount: '+(target?target.health.toFixed(1)+' / '+target.mountHealth.toFixed(1):'none')+'\nConfirmed hits / blocked: '+room.events.filter(e=>e.type==='hit').length+' / '+room.events.filter(e=>e.type==='blocked').length+'\nVisible shots: '+scene.getObjectsByProperty('type','Mesh').filter(m=>m.name.startsWith('projectile:')).length;}
function kit(){const mode=document.querySelector('#weapon').value;if(mode==='hammer'){SUPPLY_BLUEPRINTS.set('hammer',hammer);return makeKit('hammer',hammer);}if(['bow','sword','foot'].includes(mode))return makeKit(mode);const source=['octopus','octopus-carry'].includes(mode)?saved.octopus:['dragon','flame'].includes(mode)?saved.dragon:saved['armed-car'];const b={...source,movement:['rifle','flame','pulse','octopus-carry'].includes(mode)?'carry':['fly','dragon'].includes(mode)?'fly':'drive'};if(mode==='pulse')b.traits={...b.traits,weapon:'pulse'};SUPPLY_BLUEPRINTS.set('harness',b);const k=makeKit('harness',b);k.stats.spread=0;return k;}
function reset(){view.clear();room=newRoom(100000);for(const e of WORLD_ENTITIES)room.destroyed[e.id]=1e12;room.nextDrop=1e12;room.placed=[{id:'wall',x:0,z:7,w:12,h:5,d:.4,hp:1e6}];player=addPlayer(room,'p','Builder');Object.assign(player,{x:0,y:0,z:0,yaw:Number(document.querySelector('#facing').value)*Math.PI/180,aimPitch:0,protectedUntil:0,kit:kit()});const scenario=document.querySelector('#target').value;target=null;wall.position.z=7;wall.visible=true;
 if(scenario!=='none'){target=addPlayer(room,'q','Target');Object.assign(target,{x:0,y:0,z:scenario==='overlap'?0:scenario==='normal'?Number(document.querySelector('#distance').value):scenario==='behind'?-1:scenario==='far'?80:scenario==='car'?4:scenario==='cover'?1.1:.9,yaw:0,protectedUntil:scenario==='protected'?room.time+3000:0,kit:makeKit(scenario==='car'?'car':'foot')});target.mountHealth=target.kit.stats.mountMax;const distance=target.z;target.x=Math.sin(player.yaw)*distance;target.z=Math.cos(player.yaw)*distance;target.yaw=player.yaw;
  if(['cover','after'].includes(scenario)){const z=scenario==='cover'?.1:1.3;room.placed[0].z=z;wall.position.z=z;}else{room.placed=[];wall.visible=false;}}
 // Cover uses the same axis-aligned box in simulation and pixels for diagonal facings.
 for(const box of room.placed){const z=box.z;box.x=Math.sin(player.yaw)*z;box.z=Math.cos(player.yaw)*z;const w=box.w,d=box.d;box.w=Math.abs(Math.cos(player.yaw))*w+Math.abs(Math.sin(player.yaw))*d;box.d=Math.abs(Math.sin(player.yaw))*w+Math.abs(Math.cos(player.yaw))*d;wall.position.set(box.x,2.5,box.z);wall.scale.set(box.w/12,1,box.d/.4);}
 cursor=room.eventId;seq=0;last='';rejection=null;draw();}
function advance(dt){advanceRoom(room,room.time+dt*1000);draw(dt);}
document.querySelector('#defeat').onclick=()=>{player.protectedUntil=0;hurt(room,player,10000,'test');draw();};document.querySelector('#settle').onclick=()=>{for(let i=0;i<120;i++){player.lastSeen=room.time;advance(1/60);}};document.querySelector('#respawn').onclick=()=>{if(player.health<=0){player.lastSeen=player.respawnAt+10;advanceRoom(room,player.respawnAt+10);draw(0);}};document.querySelector('#drop-item').onclick=()=>{applyInput(room,player.id,{seq:++seq,command:{id:seq,type:'exit'}},room.time);draw();};document.querySelector('#pickup-item').onclick=()=>{applyInput(room,player.id,{seq:++seq,command:{id:seq,type:'pickup',mode:room.items[0]?.id}},room.time);draw();};
document.querySelector('#fire').onclick=()=>{rejection=attackBlockReason(room,player);applyInput(room,player.id,{seq:++seq,input:{cameraYaw:Number(document.querySelector('#orbit').value),weaponPitch:0},command:{id:seq,type:'fire'}},room.time);advance(.02);};document.querySelector('#advance').onclick=()=>advance(.08);document.querySelector('#reset').onclick=reset;document.querySelector('#weapon').onchange=reset;document.querySelector('#target').onchange=reset;document.querySelector('#distance').onchange=reset;document.querySelector('#facing').onchange=reset;document.querySelector('#orbit').onchange=()=>{const yaw=Number(document.querySelector('#orbit').value);camera.position.set(-Math.sin(yaw+.3)*15,8,-Math.cos(yaw+.3)*15);camera.lookAt(0,1.5,3);draw();};reset();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw();});
</script></html>
