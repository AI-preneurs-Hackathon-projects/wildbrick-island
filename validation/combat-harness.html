<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrickWild firing validation</title>
<style>body{margin:0;background:#b4dedd;font:15px system-ui;color:#183d35}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;top:16px;left:16px;max-width:320px;padding:18px;background:#fffaf0ee;border-radius:12px}label{display:block;margin:10px 0}button,select,input{font:inherit;padding:8px}output{display:block;white-space:pre-line;margin-top:12px}p{font-size:13px;line-height:1.5}</style>
<aside><strong>Local combat validation</strong><p>Actual Arena simulation and renderer. Snapshots are delivered after each step; no production multiplayer or API calls.</p><label>Weapon <select id="weapon"><option value="bow">Bow</option><option value="rover">Twin-gun rover</option></select></label><label>Aim height <input id="pitch" type="range" min="-0.65" max="0.65" step="0.05" value="0"></label><button id="fire">Fire + 20 ms</button> <button id="advance">Advance 80 ms</button><button id="reset">Reset</button><output id="status"></output></aside>
<script type="module">
import * as THREE from '/vendor/three.module.js';
import {createArenaView} from '/arena-view.js';
import {newRoom,addPlayer,makeKit,applyInput,advanceRoom,roomSnapshot} from '/arena-core.js';
import {WORLD_ENTITIES} from '/world-data.js';
import {SUPPLY_BLUEPRINTS} from '/supply-catalog.js';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,200),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#b4dedd');document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x74896a,2.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-5,10,-6);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:'#8cbf79'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);scene.add(new THREE.GridHelper(60,30,0x536f55,0x80a774));camera.position.set(12,8,-15);camera.lookAt(0,1.5,4);
const wall=new THREE.Mesh(new THREE.BoxGeometry(12,5,.4),new THREE.MeshStandardMaterial({color:'#cb7255'}));wall.position.set(0,2.5,7);scene.add(wall);const view=createArenaView(scene,camera);let room,player,cursor,seq,last='';
function draw(dt=0){const snap=roomSnapshot(room,player.id,cursor);for(const e of snap.events){view.effect(e);cursor=e.id;if(['shot','impact'].includes(e.type))last=e.type+': '+[e.x,e.y,e.z].map(n=>n.toFixed(2)).join(', ');}view.update(snap,player,SUPPLY_BLUEPRINTS,dt,room.time);renderer.render(scene,camera);document.querySelector('#status').textContent='Body facing: '+player.yaw.toFixed(2)+' rad\n'+last+'\nVisible shots: '+scene.getObjectsByProperty('type','Mesh').filter(m=>m.name.startsWith('projectile:')).length;}
function reset(){view.clear();room=newRoom(100000);for(const e of WORLD_ENTITIES)room.destroyed[e.id]=1e12;room.nextDrop=1e12;room.placed=[{id:'wall',x:0,z:7,w:12,h:5,d:.4,hp:1e6}];player=addPlayer(room,'p','Builder');Object.assign(player,{x:0,y:0,z:0,yaw:1.2,aimYaw:0,aimPitch:0,protectedUntil:0,kit:document.querySelector('#weapon').value==='bow'?makeKit('bow'):makeKit('supply:rover',SUPPLY_BLUEPRINTS.get('supply:rover'))});cursor=room.eventId;seq=0;last='';draw();}
function advance(dt){advanceRoom(room,room.time+dt*1000);draw(dt);}
document.querySelector('#fire').onclick=()=>{applyInput(room,player.id,{seq:++seq,input:{cameraYaw:0,aimPitch:Number(document.querySelector('#pitch').value)},command:{id:seq,type:'fire'}},room.time);advance(.02);};document.querySelector('#advance').onclick=()=>advance(.08);document.querySelector('#reset').onclick=reset;document.querySelector('#weapon').onchange=reset;document.querySelector('#pitch').oninput=()=>{player.aimPitch=Number(document.querySelector('#pitch').value);draw();};reset();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw();});
</script></html>
