<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrickWild support validation</title><style>body{margin:0;font:15px system-ui}canvas{display:block}aside{position:absolute;top:16px;left:16px;width:270px;background:#fff8e9ef;padding:18px;border-radius:18px}button,select{font:inherit;padding:9px;margin:5px 0}output{display:block;white-space:pre-line}</style><aside><b>Local landing validation</b><p>Actual map, character and shared movement. No network or generation.</p><label>Surface <select id="surface"><option value="crate">Crate</option><option value="tree">Tree</option><option value="loose">Loose brick</option></select></label><button id="jump">Jump forward 0.3 s</button><button id="walk">Walk forward 0.5 s</button><button id="settle">Settle 0.6 s</button><button id="reset">Reset</button><output id="state"></output></aside><script type="module">
import * as THREE from '/vendor/three.module.js';import {createWorld} from '/world.js';import {character} from '/models.js';import {createSimulation} from '/simulation.js';import {WORLD_ENTITIES} from '/world-data.js';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#b4dedd');document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x74896a,2.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-5,20,10);scene.add(sun);const world=createWorld(scene),pilot=character();scene.add(pilot.group);const sim=await createSimulation(world.obstacles,()=>{});sim.state.started=true;
function render(){const s=sim.state;pilot.group.position.set(s.x,s.y,s.z);pilot.group.rotation.y=s.yaw;renderer.render(scene,camera);document.querySelector('#state').textContent=`Height: ${s.y.toFixed(3)} m\nGrounded: ${s.grounded}\nPosition: ${s.x.toFixed(2)}, ${s.z.toFixed(2)}`;}
function run(n,input={}){for(let i=0;i<n;i++)sim.update(1/60,input);render();}
function reset(){const kind=document.querySelector('#surface').value,e=WORLD_ENTITIES.find(e=>e.id===(kind==='crate'?'crate:0':kind==='tree'?'tree:inner:0':'loose:1'))||WORLD_ENTITIES.find(e=>e.kind===kind),b=e.boxes[0];Object.assign(sim.state,{x:b.x,y:0,z:b.z-(kind==='crate'?2.2:4),yaw:0,vy:0,jumpRemaining:0,grounded:true});camera.position.set(b.x-9,7,b.z-9);camera.lookAt(b.x,1,b.z);run(1);}
document.querySelector('#jump').onclick=()=>{sim.jump();run(18,{z:1,cameraYaw:0});};document.querySelector('#walk').onclick=()=>run(30,{z:1,cameraYaw:0});document.querySelector('#settle').onclick=()=>run(36);document.querySelector('#reset').onclick=reset;document.querySelector('#surface').onchange=reset;reset();
</script></html>
