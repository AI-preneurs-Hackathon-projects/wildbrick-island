<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brickwild saved creation review</title><link rel="stylesheet" href="/style.css"><style>#review{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:3;background:#fffaf0;padding:8px;border-radius:8px;max-width:350px;font:12px sans-serif}#review button,#review select{margin:3px;min-height:30px}#review output{display:block}</style></head><body><div id="game"><div id="scene" aria-label="UI fixture without WebGL"></div><div id="ui"></div><aside id="review"><strong>Local fixture · no API calls or creation-storage writes</strong><div><label>Records <select id="record-count"><option>0</option><option>1</option><option>5</option><option selected>6</option><option>12</option></select></label><button id="add-design">Complete new design</button><button id="fixture-mode">Switch to Arena UI</button><button id="fixture-ko">Toggle KO</button><button id="fixture-round">Toggle round end</button><button id="finish-build">Finish assembly</button></div><output id="review-result" role="status"></output></aside></div><script type="module">
import {createUI} from '/ui.js';
import {createInput} from '/input.js';
import {createArenaUI} from '/arena-ui.js';
import {createCreationSelection} from '/creation-slots.js';
import {createAdventure} from '/adventure.js';
import {createState} from '/rules.js';
import {newRoom,addPlayer,makeKit,roomSnapshot,applyInput,advanceRoom} from '/arena-core.js';
import fixtures from '/__combat-fixtures.js';
const state=createState(),room=newRoom(100000),p=addPlayer(room,'local-fixture','Reviewer');let adventure=createAdventure(),ui,input,arenaUI,rebuilds=0,serial=0;
const getState=()=>({...state,...(state.arena?{health:p.health,building:p.building,roundFinished:room.round.status==='finished'}:{})});
const output=()=>document.querySelector('#review-result').textContent=`Rebuild requests: ${rebuilds} · Generation requests: 0 · ${adventure.creations.length} saved fixtures · ${getState().building?'assembling':'ready'}`;
const selection=createCreationSelection({records:()=>adventure.creations,state:getState,onNotice:message=>ui.toast(message),onRebuild(b){rebuilds++;if(state.arena)applyInput(room,p.id,{seq:p.lastSeq+1,command:{id:p.lastCommand+1,type:'build',mode:'generated'}},room.time,makeKit('generated',b,'fixture:'+b.name));else state.building={mode:'car',time:0,duration:1.2,custom:{blueprint:b}};output();return true;}});
function render(){ui.update(getState());if(state.arena)arenaUI.update({active:true,self:p,snapshot:roomSnapshot(room,p.id),serverTime:()=>room.time});output();}
const actions={state:getState,recent:selection.slots,older:selection.older,rebuild:selection.choose,rebuildOlder:selection.chooseOlder,saved:()=>false,start(){state.started=true;},pause(v){state.paused=v;input?.clear();},voice(){ui.toast('No microphone or provider calls in this fixture.');},describe(){ui.toast('No generation in this fixture. Use Complete new design.');},sound(){return false;},cancelDesign(){},jump(){},action(){},openArena(){state.arena=true;render();}};
ui=createUI(actions);arenaUI=createArenaUI({openCollection:()=>ui.openMenu('collection')});input=createInput({getState,onCollection:()=>ui.openMenu('collection'),onSlot:selection.choose,onHotkeys:()=>ui.toggleMenu('hotkeys'),onPause:()=>ui.toggleMenu('pause'),onMic:actions.voice});
function seed(){adventure=createAdventure();for(let i=0;i<Number(document.querySelector('#record-count').value);i++)adventure.remember({...structuredClone(fixtures['armed-car']),name:'Saved car '+i});render();}
document.querySelector('#record-count').onchange=seed;document.querySelector('#add-design').onclick=()=>{adventure.remember({...structuredClone(fixtures.octopus),name:'New octopus '+(++serial)});render();};
document.querySelector('#fixture-mode').onclick=()=>{state.arena=!state.arena;if(!state.arena)arenaUI.reset();else arenaUI.setStatus('online');document.querySelector('#fixture-mode').textContent=state.arena?'Switch to Practice UI':'Switch to Arena UI';render();};
document.querySelector('#fixture-ko').onclick=()=>{p.health=p.health?0:100;state.health=p.health;render();};document.querySelector('#fixture-round').onclick=()=>{room.round.status=room.round.status==='finished'?'active':'finished';state.roundFinished=room.round.status==='finished';render();};document.querySelector('#finish-build').onclick=()=>{state.building=null;if(p.building)advanceRoom(room,p.building.ends+1);render();};
// Start through the actual form. No creation fixture is persisted; ordinary tour dismissal may save its existing seen flag.
document.querySelector('#player-name').value='Reviewer';document.querySelector('#explore-start').click();document.querySelector('#tour-skip')?.click();document.activeElement.blur();seed();setInterval(render,100);
</script></body></html>
