<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brickwild controls preview</title><link rel="stylesheet" href="/style.css"></head><body><div id="game"><div id="scene" aria-label="Controls preview; no 3D renderer"></div><div id="ui"></div></div><script type="module">
// Development-only control surface. Real UI/input modules; no WebGL or network.
import {createUI} from '/ui.js';
import {createInput} from '/input.js';
import {createArenaUI} from '/arena-ui.js';
import {MAP_CYCLE} from '/map-catalog.js';
import {createState} from '/rules.js';
import {newRoom,addPlayer,roomSnapshot,advanceRoom,applyInput} from '/arena-core.js';
const state=createState(),room=newRoom();const requestedMap=new URLSearchParams(location.search).get('map');if(MAP_CYCLE.includes(requestedMap))room.round.mapId=requestedMap;const player=addPlayer(room,'preview','Builder');
let input,arenaUI,ui;
const actions={state:()=>state,start(){state.started=true;},openArena(){return arenaUI.play();},recent:()=>[{name:'Saved moon rover'}],saved:()=>true,rebuild(){ui.toast('Rebuilt saved model fixture');},build(){},action(){ui.toast('Attack pressed');},jump(){ui.toast('Jump pressed');},voice(){ui.toast('Speak shortcut pressed — voice service is not started in this preview.');},sound(){return false;},auto(){return false;},pause(v){state.paused=v;input?.clear();},respawn(){},cancelDesign(){},exitHome(){actions.leaveArena();state.started=false;ui.showEntry();},leaveArena(){state.arena=false;state.mode='foot';client.active=false;arenaUI.reset();ui.resetPlayUI();ui.update(state);ui.toast('Back in Practice.');},describe(){ui.toast('Typed description received — this preview does not call OpenAI.');}};
const client={self:player,snapshot:roomSnapshot(room,player.id),active:true,room:'PREVIEW',serverTime:()=>room.time};
ui=createUI(actions);arenaUI=createArenaUI({getPlayerName:ui.playerName,join:async(name)=>{client.active=true;player.name=name;client.snapshot=roomSnapshot(room,player.id);state.arena=true;arenaUI.setStatus('online');arenaUI.update(client);return true;},leave:actions.leaveArena,exitHome:actions.exitHome,openCollection:()=>ui.openMenu('collection'),toast:ui.toast});
input=createInput({onBuild:actions.build,onAction:actions.action,onJump:actions.jump,onPause:()=>ui.toggleMenu('pause'),onMic:actions.voice,onHotkeys:()=>ui.toggleMenu('hotkeys'),onHome:actions.respawn,getState:()=>state});
if(new URLSearchParams(location.search).has('play')){localStorage.setItem('brickwild-tour-v1','seen');document.querySelector('#player-name').value='Preview';document.querySelector('#start').click();}
if(new URLSearchParams(location.search).has('roster')){const other=addPlayer(room,'other','Preview'),stale=addPlayer(room,'stale','Disconnected');other.lastSeen=room.round.endsAt;stale.lastSeen=0;}
if(new URLSearchParams(location.search).has('finished')){player.kills=7;player.deaths=2;player.lastSeen=room.round.endsAt;advanceRoom(room,room.round.endsAt);client.snapshot=roomSnapshot(room,player.id);}
if(new URLSearchParams(location.search).has('speech')){
 const panel=document.createElement('aside');panel.style.cssText='position:absolute;top:42%;left:50%;transform:translateX(-50%);z-index:30;background:#fff8e9;padding:10px;border-radius:10px;max-width:85%;font:12px system-ui';panel.innerHTML='<label>Speech fixture <select id="speech-fixture"><option>Empty</option><option>Partial</option><option>Long transcript</option><option>Complete</option><option>Designing</option><option>Error</option></select></label><output id="speech-check" style="display:block"></output>';document.body.append(panel);
 const texts=['','“Build a blue','“Build a blue flying castle with golden towers and a garden on its roof. Add bright windows, a big entrance and white clouds all around it. Make the entire creation from colorful toy bricks and let me ride it across the island.”','“Build a blue flying castle.”','Designing your creation…','The microphone is unavailable. Open Help to type your idea.'];
 const select=document.querySelector('#speech-fixture'),result=document.querySelector('#speech-check'),rect=()=>{const b=document.querySelector('#mic').getBoundingClientRect();return {x:b.x,y:b.y,width:b.width,height:b.height};};
 const stage=i=>{ui.voiceState(i===1||i===2?'listening':'idle',texts[i]);if(i===0)document.querySelector('#voice-status').textContent='';if(i===4)ui.generationState('designing',texts[i]);else ui.generationState('idle');};
 select.onchange=()=>stage(select.selectedIndex);
 requestAnimationFrame(async()=>{const baseline=rect(),samples=[];for(let i=0;i<texts.length;i++){stage(i);await new Promise(requestAnimationFrame);samples.push(rect());}const drift=Math.max(...samples.flatMap(b=>['x','y','width','height'].map(k=>Math.abs(b[k]-baseline[k]))));result.textContent=`${innerWidth}px viewport: ${samples.length} speech states, maximum button shift ${drift.toFixed(2)}px`;result.dataset.passed=String(drift<.1);select.selectedIndex=2;stage(2);});
}
let wall=performance.now();function frame(){const now=performance.now(),elapsed=now-wall;wall=now;for(const p of Object.values(room.players))p.lastSeen=room.time+elapsed;advanceRoom(room,room.time+elapsed);client.snapshot=roomSnapshot(room,player.id);ui.update(state);if(state.arena)arenaUI.update(client);requestAnimationFrame(frame);}frame();
</script></body></html>
