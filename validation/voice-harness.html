<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brickwild voice review</title><link rel="stylesheet" href="/style.css"><style>#voice-review{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);padding:12px;background:#fffaf0;border:2px solid #254139;border-radius:12px;max-width:calc(100vw - 24px);max-height:35dvh;overflow:auto;pointer-events:auto;font-size:14px}#voice-review button,#voice-review select{margin:4px;padding:6px}#voice-review p{margin:5px 0}#voice-review h2{font-size:18px;margin:0}</style></head><body><div id="game"><div id="scene"></div><div id="ui"></div><section id="voice-review"><h2>Voice review · no upload or generation</h2><p>Real-microphone mode records only in memory and discards the audio. Its transcript is synthetic. Native-success mode also uses a fake recognizer.</p><label>Route <select id="voice-route"><option value="synthetic">Synthetic recorder</option><option value="native">Synthetic native success</option><option value="failure">Synthetic native failure</option><option value="microphone">Real microphone · no upload</option></select></label><label><input type="checkbox" id="voice-delay">Delay mock response 5s</label><button id="voice-reset">Reset route</button><button id="voice-ko">Simulate KO / round end</button><button id="voice-transition">Simulate home / Arena transition</button><p id="voice-review-status" role="status">No attempt yet.</p></section></div><script type="module">
import {createVoice} from '/voice-controller.js';
import {createUI} from '/ui.js';
import {createInput} from '/input.js';
import {createState} from '/rules.js';
let voice,input,ui,dispatches=0,uploads=0;const state=createState(),$=s=>document.querySelector(s);
const report=()=>$('#voice-review-status').textContent=`State: ${voice?.state||'idle'} · mock transcription calls: ${uploads} · creation callbacks: ${dispatches}`;
const actions={state:()=>state,start(){state.started=true;},pause(v){state.paused=v;input?.clear();if(v)voice?.stop();},recent:()=>[],saved:()=>true,voice(){if(state.started&&!state.paused)voice.start();report();},recordVoice(){voice.record().then(report);},cancelVoice(){voice.stop();report();},describe(){dispatches++;report();},sound(){return false;},openArena(){voice.stop();},cancelDesign(){},build(){},jump(){},action(){},drop(){},pickup(){}};
ui=createUI(actions);input=createInput({onMic:actions.voice,onPause:()=>ui.toggleMenu('pause'),onHotkeys:()=>ui.toggleMenu('hotkeys'),getState:()=>state});
// Skip only this development harness's entry, without writing a persistence flag.
$('#player-name').value='Voice review';$('#explore-start').click();if($('#tour-skip'))$('#tour-skip').click();
class SyntheticRecognition{start(){this.onstart();this.timer=setTimeout(()=>{this.onresult({results:[Object.assign([{transcript:'a synthetic blue toy car'}],{isFinal:true})]});this.onend();},1200);}stop(){clearTimeout(this.timer);this.onend();}abort(){clearTimeout(this.timer);}}
class FailedRecognition{start(){this.timer=setTimeout(()=>this.onerror({error:'network'}),300);}abort(){clearTimeout(this.timer);}}
class SyntheticRecorder{static isTypeSupported(t){return t==='audio/webm;codecs=opus';}constructor(){this.mimeType='audio/webm;codecs=opus';this.state='inactive';}start(){this.state='recording';}stop(){this.state='inactive';setTimeout(()=>{this.ondataavailable?.({data:new Blob([new Uint8Array(32)],{type:this.mimeType})});this.onstop?.();},100);}}
function reset(){voice?.dispose();dispatches=uploads=0;const route=$('#voice-route').value,platform={Recognition:route==='native'?SyntheticRecognition:route==='failure'?FailedRecognition:null,fetch:async(_url,{signal})=>{uploads++;report();await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{signal.removeEventListener('abort',abort);resolve();},$('#voice-delay').checked?5000:200),abort=()=>{clearTimeout(timer);reject(Error('canceled'));};signal.addEventListener('abort',abort,{once:true});});return Response.json({text:'a synthetic blue toy car'});}};if(route!=='microphone')Object.assign(platform,{MediaRecorder:SyntheticRecorder,mediaDevices:{async getUserMedia(){const t={stop(){}};return {getTracks:()=>[t],getAudioTracks:()=>[t]};}}});voice=createVoice({onCommand:actions.describe,onState:(...a)=>{ui.voiceState(...a);report();},onFallback:ui.voiceFallback,onNotice:ui.toast,platform});ui.voiceState('idle');report();}
$('#voice-reset').onclick=reset;$('#voice-route').onchange=reset;$('#voice-ko').onclick=()=>{voice.stop();report();};$('#voice-transition').onclick=()=>{voice.stop();report();};reset();
</script></body></html>
