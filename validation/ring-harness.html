<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrickWild ring validation</title><style>body{margin:0;font:15px system-ui}canvas{display:block}aside{position:absolute;top:16px;left:16px;width:260px;background:#fff8e9ef;padding:18px;border-radius:18px}button,select{font:inherit;padding:9px;margin:5px 0}output{display:block;white-space:pre-line}</style><aside><b>Local sky-ring validation</b><p>Actual world, plane and shared collision. No network or generation.</p><label>Ring <select id="ring"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><label>Direction <select id="direction"><option value="1">Forward</option><option value="-1">Reverse</option></select></label><button id="fly">Fly 0.2 seconds</button><button id="reset">Reset</button><output id="state"></output></aside><script type="module">
import * as THREE from '/vendor/three.module.js';import {createWorld} from '/world.js';import {createArenaView} from '/arena-view.js';import {newRoom,addPlayer,makeKit,roomSnapshot,predictPlayer} from '/arena-core.js';import {RINGS} from '/rules.js';import {passedRing} from '/ring-pass.js';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#b4dedd');document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x74896a,2.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-5,20,10);scene.add(sun);createWorld(scene);const view=createArenaView(scene,camera);let room,p,index,yaw,crossed;
function draw(){view.update(roomSnapshot(room,p.id),p,new Map(),.2,room.time);renderer.render(scene,camera);const ring=RINGS[index],distance=(p.x-ring.x)*Math.sin(yaw)+(p.z-ring.z)*Math.cos(yaw);document.querySelector('#state').textContent=`Distance past ring: ${distance.toFixed(2)} m\nOpening crossed: ${crossed}\nAltitude: ${p.y.toFixed(2)} m`;}
function reset(){view.clear();index=Number(document.querySelector('#ring').value);const ring=RINGS[index],next=RINGS[(index+1)%5];yaw=Math.atan2(next.x-ring.x,next.z-ring.z)+(Number(document.querySelector('#direction').value)<0?Math.PI:0);room=newRoom(1e5);p=addPlayer(room,'p','Pilot');p.kit=makeKit('plane');Object.assign(p,{x:ring.x-Math.sin(yaw)*10,y:ring.y-1.375,z:ring.z-Math.cos(yaw)*10,yaw});crossed=false;camera.position.set(ring.x-Math.sin(yaw)*17+Math.cos(yaw)*15,ring.y+8,ring.z-Math.cos(yaw)*17-Math.sin(yaw)*15);camera.lookAt(ring.x,ring.y,ring.z);for(let i=0;i<60;i++)view.update(roomSnapshot(room,p.id),p,new Map(),.2,room.time);draw();}
document.querySelector('#fly').onclick=()=>{for(let i=0;i<12;i++){const before={...p};predictPlayer(p,{z:1,cameraYaw:yaw},1/60,room);crossed ||=passedRing(before,p,index,2.75);room.time+=1000/60;}draw();};document.querySelector('#reset').onclick=reset;document.querySelector('#ring').onchange=reset;document.querySelector('#direction').onchange=reset;reset();
</script></html>
