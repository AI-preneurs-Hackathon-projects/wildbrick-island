<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrickWild maps</title><style>body{margin:0;background:#b4dedd;font:14px system-ui;color:#254139}canvas{display:block}aside{position:absolute;top:16px;left:16px;background:#fff8e9ed;border-radius:14px;padding:15px;max-width:300px}label,output{display:block;margin:6px 0}button,select{font:inherit;padding:8px}#capture{position:absolute;inset:0;background:#b4dedd;display:none}#capture img{width:100%;height:100%;object-fit:contain}body.clean aside{display:none}</style>
<aside><strong>BrickWild · Map preview</strong><label>Map <select id="map"><option value="island">Wildbrick Island</option><option value="beach">Stranded Beach</option><option value="mountain">Mountain Village</option></select></label><label>View <select id="view"><option value="overview">Overview</option><option value="foot">On foot</option><option value="car">Drive route</option><option value="plane">Fly route</option></select></label><button id="travel">Traverse route</button><button id="animate">Animate route</button> <button id="round">Next round</button><button id="capture-button">Clean map image</button><output id="status"></output><p>Actual map, collision, Arena renderer and movement. Local simulation; no API or microphone.</p></aside><div id="capture"></div>
<script type="module">
import * as THREE from '/vendor/three.module.js';import {createWorld} from '/world.js';import {createArenaView} from '/arena-view.js';import {MAP_CYCLE,arenaMap} from '/map-catalog.js';import {newRoom,addPlayer,advanceRoom,roomSnapshot,makeKit,predictPlayer} from '/arena-core.js';import {gameCamera} from '/game-camera.js';
const params=new URLSearchParams(location.search),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,500),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#b4dedd');renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);scene.fog=new THREE.Fog(0xb4dedd,130,330);scene.add(new THREE.HemisphereLight(0xe9fcff,0x66854d,2));const sun=new THREE.DirectionalLight(0xffecc5,2.65);sun.position.set(-28,70,24);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-75,right:75,top:75,bottom:-75,near:1,far:180});sun.shadow.normalBias=.04;scene.add(sun);const view=createArenaView(scene,camera);let world,room,player,travel=false,routeStart,traveled=0;
const mapSelect=document.querySelector('#map'),viewSelect=document.querySelector('#view'),status=document.querySelector('#status');
function reset(id){world?.dispose();view.clear();room=newRoom(100000);room.round.mapId=id;player=addPlayer(room,'preview','Builder');player.protectedUntil=0;world=createWorld(scene,id);travel=false;traveled=0;mode();}
function mode(){const kind=viewSelect.value;player.kit=makeKit(kind==='car'?'car':kind==='plane'?'plane':'foot');const z=room.round.mapId==='island'?25.5:room.round.mapId==='beach'?9:0;Object.assign(player,{x:-43,y:kind==='plane'?20:0,z,yaw:Math.PI/2,speed:0,vy:0,grounded:kind!=='plane'});routeStart={x:player.x,y:player.y,z:player.z};travel=false;traveled=0;}
mapSelect.value=MAP_CYCLE.includes(params.get('map'))?params.get('map'):'island';viewSelect.value=params.get('view')||'overview';if(params.has('clean'))document.body.classList.add('clean');reset(mapSelect.value);
document.querySelector('#animate').onclick=()=>{mode();travel=true;};mapSelect.onchange=()=>reset(mapSelect.value);viewSelect.onchange=mode;document.querySelector('#travel').onclick=()=>{mode();for(let i=0;i<1200&&player.x<42;i++){predictPlayer(player,{z:1,cameraYaw:Math.PI/2},1/60,room);player.lastSeen=room.time+1000/60;advanceRoom(room,room.time+1000/60);}traveled=player.x-routeStart.x;draw();status.textContent=arenaMap(room).name+' · '+viewSelect.value+' route: '+traveled.toFixed(2)+' m, height '+player.y.toFixed(2);};document.querySelector('#round').onclick=()=>{player.lastSeen=room.round.endsAt;advanceRoom(room,room.round.endsAt);player.lastSeen=room.round.intermissionEndsAt;advanceRoom(room,room.round.intermissionEndsAt);mapSelect.value=room.round.mapId;world.dispose();world=createWorld(scene,room.round.mapId);view.clear();travel=false;};
function draw(){if(viewSelect.value==='overview'){camera.position.set(95,94,112);camera.lookAt(0,0,0);}else{const p={...player,mode:player.kit.mode,arena:true},look=gameCamera(p,player.kit,{yaw:Math.PI/2+.18,pitch:.43},innerWidth/innerHeight);camera.position.copy(look.position);camera.lookAt(look.target.x,look.target.y,look.target.z);}view.update(roomSnapshot(room,player.id),player,new Map(),1/60,room.time);world.setDestroyed(Object.keys(room.destroyed));world.updateCamera(camera.position,{x:player.x,y:player.y+1.5,z:player.z},1/60);renderer.render(scene,camera);}
let before=performance.now();function frame(){const now=performance.now(),dt=Math.min(.04,(now-before)/1000);before=now;player.lastSeen=room.time+dt*1000;if(travel){predictPlayer(player,{z:1,cameraYaw:Math.PI/2},dt,room);traveled=player.x-routeStart.x;if(player.x>=42)travel=false;}advanceRoom(room,room.time+dt*1000);draw();status.textContent=`${arenaMap(room).name} · Round ${room.round.id}\nPosition ${player.x.toFixed(2)}, ${player.y.toFixed(2)}, ${player.z.toFixed(2)}\nRoute progress ${traveled.toFixed(2)} m${traveled>=84?' · crossed':''}`;requestAnimationFrame(frame);}frame();
document.querySelector('#capture-button').onclick=()=>{viewSelect.value='overview';draw();const image=document.createElement('img');image.id='map-image';image.alt=arenaMap(room).name+' rendered Arena map';image.src=renderer.domElement.toDataURL('image/png');const capture=document.querySelector('#capture');capture.replaceChildren(image);capture.style.display='block';document.querySelector('aside').style.display='none';};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
